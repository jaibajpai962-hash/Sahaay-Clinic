<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sahaay Clinic — Reset Password</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="page-container" style="max-width:560px;margin:60px auto"><div class="card"><div class="card-header"><span class="card-title">🔐 Reset Password</span></div><div class="card-body"><form id="reset-form"><div class="form-group"><label class="form-label">New Password</label><input id="new-password" type="password" class="form-control" minlength="6" required></div><div class="form-group"><label class="form-label">Confirm Password</label><input id="confirm-password" type="password" class="form-control" minlength="6" required></div><div id="msg" class="alert hidden"></div><button id="btn" class="btn btn-primary btn-full">Reset Password</button></form></div></div></main><script src="/js/app.js"></script><script src="/js/api.js"></script><script>document.getElementById('reset-form').addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('new-password').value,c=document.getElementById('confirm-password').value,m=document.getElementById('msg'),b=document.getElementById('btn');if(p.length<6||p!==c){m.className='alert alert-danger';m.textContent=p.length<6?'Password must be at least 6 characters.':'Passwords do not match.';m.classList.remove('hidden');return}const token=new URLSearchParams(location.search).get('token');if(!token){m.className='alert alert-danger';m.textContent='Reset token is missing.';m.classList.remove('hidden');return}b.disabled=true;try{const r=await apiResetPassword(token,p);m.className='alert '+(r.success?'alert-success':'alert-danger');m.textContent=r.message||'Done';m.classList.remove('hidden');if(r.success)setTimeout(()=>location.href='/index.html',1200)}catch(err){m.className='alert alert-danger';m.textContent=err.message||'Reset failed.';m.classList.remove('hidden')}finally{b.disabled=false}})</script></body></html>
